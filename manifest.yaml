# hcloud-hrobot-talos-cluster runs a Talos Kubernetes cluster for one app, its
# control plane on Hetzner Cloud and its worker on a Hetzner dedicated server
# the app's Robot account rents, both from talos-cluster-kit. The control
# plane is the kit's: a control-plane node in each of fsn1, nbg1 and hel1, a
# private network whose default route goes to a gateway, a firewall with no
# rule, an API and an ingress load balancer in fsn1, a private cluster
# repository on GitHub, and the cluster's own disk image that a short-lived
# builder writes and every node boots from.
#
# Subscribe names the dedicated server after the subscription, puts it on a
# vSwitch whose subnet joins the Cloud network, and writes Talos onto its disk
# from Hetzner's rescue system, in the background of the call that renders the
# cluster's keys. The control-plane nodes take no app pod, so an app runs on
# the worker. Every Cloud resource carries the subscription id as a label, the
# repository carries it as a topic, and the server and vSwitch carry it in
# their names. Unsubscribe deletes every Cloud resource and the repository,
# cancels the vSwitch, and releases the server without cancelling it.
apiVersion: mitstack/v1beta
type: capability
metadata:
  id: hcloud-hrobot-talos-cluster
  name: Hetzner Cloud and Robot Talos cluster
  owner: mitstack
spec:
  version: 0.3.3
  releaseClass: correctness-fix
  releaseNote: >-
    The block builds on talos-cluster-kit v0.20.0, so the ingress load
    balancer sends web traffic to the Robot worker at its vSwitch address,
    where Traefik runs, and to no control-plane node. A cluster built from an
    earlier release loses its control-plane ingress target on its next
    subscribe.
  description: >
    Runs a Talos Kubernetes cluster with its control plane on three Hetzner
    Cloud nodes in fsn1, nbg1 and hel1 and its worker on a Hetzner dedicated
    server joined over a vSwitch, with Argo CD syncing a repository it creates.
  lifecycle:
    endpoint: https://api.mitstack.dev/operators/hcloud-hrobot-talos-cluster/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
    # The image build, its snapshot, the nodes' first boot and the worker's rescue install take up to 90m.
    settleBudget: 105m
    verbConnections:
      validate: [hetzner, github]
      unsubscribe: [hetzner, github]
  resources:
    - hetzner.network
    - hetzner.firewall
    - name: api-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: ingress-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: github.repository
      type: github.gitops-repository
    - github.gitops-commit
    - name: gateway
      type: hetzner.server
    - name: node-fsn1
      type: hetzner.server
    - name: node-nbg1
      type: hetzner.server
    - name: node-hel1
      type: hetzner.server
    - name: dedicated-server
      type: hetzner.dedicated-server
    - name: vswitch
      type: hetzner.vswitch
    - name: robot-firewall
      type: hetzner.robot-firewall
    - hetzner.kubernetes-cluster
  provides:
    - hetzner.kubernetes-cluster
