# hcloud-hrobot-talos-cluster runs a Talos Kubernetes cluster for one app, its
# control plane on Hetzner Cloud and its worker on a Hetzner dedicated server
# the app's Robot account rents, both from talos-cluster-kit. The control
# plane is the kit's: a control-plane node in each of fsn1, nbg1 and hel1, a
# private network whose default route goes to a gateway, a firewall with no
# rule, an API and an ingress load balancer in fsn1, a private cluster
# repository on GitHub, and the cluster's own disk image that a short-lived
# builder writes and every node boots from.
#
# Subscribe names the dedicated server after the subscription, puts it on a
# vSwitch whose subnet joins the Cloud network, and writes Talos onto its disk
# from Hetzner's rescue system, in the background of the call that renders the
# cluster's keys. The control-plane nodes take no app pod, so an app runs on
# the worker. Every Cloud resource carries the subscription id as a label, the
# repository carries it as a topic, and the server and vSwitch carry it in
# their names. Unsubscribe deletes every Cloud resource and the repository,
# cancels the vSwitch, and releases the server without cancelling it.
apiVersion: mitstack/v1beta
type: capability
metadata:
  id: hcloud-hrobot-talos-cluster
  name: Hetzner Cloud and Robot Talos cluster
  owner: mitstack
spec:
  version: 0.3.9
  releaseClass: correctness-fix
  releaseNote: >-
    0.3.9: the block builds on talos-cluster-kit v0.27.0, which lets each app
    on a cluster that hosts the platform get a Let's Encrypt certificate. The
    hosting set carries the ClusterIssuer `letsencrypt-production` that every
    app's Ingress asks for, solving HTTP-01 through Traefik. cert-manager may
    look names up, reach Let's Encrypt's ACME API on 443 and fetch an app's
    hostname on 80, and nothing else. The gateway forwards port 80 to the
    ingress load balancer's public address alone, so cert-manager's own check
    of the challenge leaves the cluster. A cluster built on an earlier release
    keeps its gateway's rules, so only a cluster built on 0.3.9 or later
    carries that forward.
    0.3.8: the block builds on talos-cluster-kit v0.26.0, which lets a
    cluster that hosts the platform serve its apps through its ingress load
    balancer. Traefik's image is named `docker.io/library/traefik`, the name a
    node asks the gateway's mirror for, so Traefik starts on the worker.
    Traefik's two entry points read the load balancer's PROXY protocol header
    from the cluster network, 10.0.0.0/16, and from no other address. The kit
    also refuses any Docker Hub image named without its namespace.
    0.3.7: the block builds on talos-cluster-kit v0.25.0, which carries two
    fixes. Talos now applies the cluster's manifests in a set order. Cilium
    and Istio's dataplane apply first, then the node report and the cluster
    tokens, then the components, and last the objects cert-manager's and
    trust-manager's webhooks validate. A cluster that hosts the platform no
    longer stalls after enrolment on a cert-manager Issuer applied before
    ztunnel, and a component that fails to apply leaves the node report
    running. The API server also reaches cert-manager's and External
    Secrets' webhooks on a Robot worker, since the hosting flows admit the
    control-plane nodes by their label. No other node, host or the world
    reaches those ports.
    0.3.6: the block builds on talos-cluster-kit v0.23.0. The gateway copies
    its image mirror with a skopeo image pinned by digest, which copies
    trust-manager's OCI image index with its digest kept, so a cluster that
    hosts the platform completes its mirror. A copy that fails powers the
    gateway off, and the subscribe then fails with the class
    gateway-mirror-failed, naming the gateway's image mirror, instead of
    waiting out the builder's 60-minute deadline.
    0.3.5: the operator builds on block-kit v0.5.5, and nothing it answers
    changes. The block's CI scans its whole history for secrets with gitleaks
    and its shell scripts with shellcheck through block-kit's shared
    workflow.
    0.3.4: the block builds on talos-cluster-kit v0.21.0, whose OpenBao
    members tolerate the control-plane taint. A cluster that hosts the
    platform now keeps that taint like every other cluster of the block.
    OpenBao's three members stay on the Cloud nodes, Traefik, Argo CD and
    every app run on the Robot worker, and the ingress load balancer targets
    the worker alone. A hosting cluster built from an earlier release moves
    its ingress target to the worker on its next subscribe. Whether its Cloud
    nodes gain the taint then is unproven, so rebuild such a cluster.
  description: >
    Runs a Talos Kubernetes cluster with its control plane on three Hetzner
    Cloud nodes in fsn1, nbg1 and hel1 and its worker on a Hetzner dedicated
    server joined over a vSwitch, with Argo CD syncing a repository it creates.
  lifecycle:
    endpoint: https://api.mitstack.dev/operators/hcloud-hrobot-talos-cluster/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
    # The image build, its snapshot, the nodes' first boot and the worker's rescue install take up to 90m.
    settleBudget: 105m
    verbConnections:
      validate: [hetzner, github]
      unsubscribe: [hetzner, github]
  resources:
    - hetzner.network
    - hetzner.firewall
    - name: api-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: ingress-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: github.repository
      type: github.gitops-repository
    - github.gitops-commit
    - name: gateway
      type: hetzner.server
    - name: node-fsn1
      type: hetzner.server
    - name: node-nbg1
      type: hetzner.server
    - name: node-hel1
      type: hetzner.server
    - name: dedicated-server
      type: hetzner.dedicated-server
    - name: vswitch
      type: hetzner.vswitch
    - name: robot-firewall
      type: hetzner.robot-firewall
    - hetzner.kubernetes-cluster
  provides:
    - hetzner.kubernetes-cluster
