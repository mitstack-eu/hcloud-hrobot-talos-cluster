# Block CI: the repository's one workflow.
#
# The block job makes one call to block-kit's reusable publish-block
# workflow. That workflow runs conformance (go vet, go test and blockverify
# --standalone), a secret scan of every commit and a shellcheck lint of every
# tracked shell script on every event, and publishes the image to ECR
# together with its provenance record only on a push to main.
#
# The uses: ref pins a released kit tag, and kit-ref must equal it and the kit
# version go.mod requires. The kit decodes runs-on itself, so it is passed as
# a JSON string.
name: Block CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  block:
    uses: mitstack-eu/block-kit/.github/workflows/publish-block.yml@v0.14.2
    with:
      block-id: hcloud-hrobot-talos-cluster
      ecr-repository: mitstack-hcloud-hrobot-talos-cluster
      kit-ref: v0.14.2
      go-version: "1.26.10"
      runs-on: ${{ vars.CI_RUNS_ON || '["ubicloud-standard-2"]' }}

